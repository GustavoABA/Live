<!doctype html>
<html lang="pt-BR" style="background:transparent!important;background-color:rgba(0,0,0,0)!important;color-scheme:light;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="rgba(0,0,0,0)">
  <title>NihilGuh — Overlay Hub</title>
  <style>
    html,body,#overlay-root,#external-overlays,#partner-layer{
      background:transparent!important;
      background-color:rgba(0,0,0,0)!important;
    }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      color-scheme:light;
    }
    #external-overlays,
    #external-overlays > object.external-overlay{
      color-scheme:light!important;
      forced-color-adjust:none!important;
      background:transparent!important;
      background-color:rgba(0,0,0,0)!important;
    }
  </style>
  <link rel="stylesheet" href="style.css?v=canvas-scheme-1">
</head>
<body style="background:transparent!important;background-color:rgba(0,0,0,0)!important;color-scheme:light;">
  <main id="overlay-root" aria-label="NihilGuh Overlay Hub">
    <section id="external-overlays" aria-hidden="true"></section>

    <section id="partner-layer" aria-live="polite" aria-atomic="true">
      <div class="partner-spark partner-spark-a">✦</div>
      <div class="partner-spark partner-spark-b">♠</div>
      <div class="partner-spark partner-spark-c">♥</div>

      <article id="partner-card" class="partner-card" aria-hidden="true">
        <div class="partner-glow"></div>
        <div class="partner-avatar-wrap">
          <img id="partner-avatar" class="partner-avatar" alt="" referrerpolicy="no-referrer">
          <span id="partner-avatar-fallback" class="partner-avatar-fallback">♛</span>
        </div>

        <div class="partner-copy">
          <span class="partner-kicker">PARCEIRO DE LIVE NO CHAT</span>
          <strong id="partner-name" class="partner-name">@parceiro</strong>
          <span id="partner-meta" class="partner-meta">COMUNIDADE NIHILGUH</span>
        </div>

        <div class="partner-stamp" aria-hidden="true">
          <span>LIVE</span>
          <b>PARTNER</b>
        </div>
      </article>
    </section>

    <div id="hub-status" class="hub-status" aria-hidden="true"></div>
  </main>

  <script src="config.js?v=canvas-scheme-1"></script>
  <script src="overlay.js?v=canvas-scheme-1"></script>
  <script>
    // O Chromium pode pintar o canvas de um documento embutido de branco quando
    // o color-scheme do host nao combina com o documento interno. Mantemos o
    // formato <object> (que ja reproduz os alertas) e corrigimos o canvas do host.
    (function normalizeEmbeddedCanvas(){
      var host = document.getElementById('external-overlays');
      if (!host) return;

      function normalize(object){
        if (!(object instanceof HTMLObjectElement)) return;
        object.style.filter = 'none';
        object.style.webkitFilter = 'none';
        object.style.colorScheme = 'light';
        object.style.forcedColorAdjust = 'none';
        object.style.background = 'transparent';
        object.style.backgroundColor = 'rgba(0,0,0,0)';
      }

      host.querySelectorAll('object.external-overlay').forEach(normalize);

      new MutationObserver(function(records){
        records.forEach(function(record){
          record.addedNodes.forEach(function(node){
            if (node && node.nodeType === 1) {
              if (node.matches && node.matches('object.external-overlay')) normalize(node);
              if (node.querySelectorAll) node.querySelectorAll('object.external-overlay').forEach(normalize);
            }
          });
        });
      }).observe(host,{childList:true,subtree:true});
    })();
  </script>
</body>
</html>
