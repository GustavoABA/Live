<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="rgba(0,0,0,0)">
  <title>NihilGuh — TikTok Follow</title>
  <style>
    :root {
      --ink: #fff7ff;
      --muted: #d7c7ee;
      --pink: #ff4fca;
      --violet: #9b6cff;
      --panel: rgba(12, 8, 22, .96);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: 100vh;
      background: transparent;
      pointer-events: none;
    }

    .alert {
      position: absolute;
      left: 50%;
      top: 34px;
      width: min(680px, calc(100vw - 40px));
      min-height: 126px;
      transform: translate(-50%, -38px) scale(.94);
      opacity: 0;
      filter: blur(8px);
      display: grid;
      grid-template-columns: 72px 1fr 94px;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid rgba(232, 211, 255, .42);
      border-radius: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(255,79,202,.18), transparent 32%),
        linear-gradient(112deg, rgba(28,14,49,.98), var(--panel) 60%, rgba(36,15,52,.96));
      box-shadow:
        0 24px 70px rgba(0,0,0,.5),
        0 0 42px rgba(155,108,255,.18),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .alert::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      border-radius: 24px 0 0 24px;
      background: linear-gradient(var(--pink), var(--violet));
      box-shadow: 0 0 26px rgba(255,79,202,.65);
    }

    .alert.show {
      animation: enter .7s cubic-bezier(.16,1,.3,1) forwards;
    }

    .alert.hide {
      animation: leave .5s cubic-bezier(.7,0,.84,0) forwards;
    }

    .icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--pink), var(--violet));
      box-shadow: 0 0 28px rgba(155,108,255,.25);
      font: 800 27px/1 Georgia, serif;
      color: white;
    }

    .copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .kicker {
      margin-bottom: 6px;
      color: var(--pink);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .nick {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 700 clamp(28px, 5vw, 42px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: .015em;
      text-shadow: 0 0 28px rgba(155,108,255,.24);
    }

    .sub {
      margin-top: 9px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .stamp {
      justify-self: end;
      width: 84px;
      height: 72px;
      display: grid;
      place-content: center;
      text-align: center;
      border-left: 1px solid rgba(232,211,255,.22);
    }

    .stamp span {
      color: #65f6ff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .18em;
    }

    .stamp b {
      margin-top: 5px;
      font: 700 15px Georgia, serif;
      letter-spacing: .08em;
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 70px;
      color: var(--violet);
      opacity: 0;
      text-shadow: 0 0 15px currentColor;
    }

    .active .s1 { animation: spark1 1.1s ease-out .1s both; }
    .active .s2 { animation: spark2 1.2s ease-out .18s both; color: var(--pink); }
    .active .s3 { animation: spark3 1.1s ease-out .24s both; }

    @keyframes enter {
      0% { opacity: 0; transform: translate(-50%, -38px) scale(.94); filter: blur(8px); }
      62% { opacity: 1; transform: translate(-50%, 5px) scale(1.012); filter: blur(0); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
    }

    @keyframes leave {
      from { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
      to { opacity: 0; transform: translate(-50%, -26px) scale(.97); filter: blur(5px); }
    }

    @keyframes spark1 {
      0% { opacity: 0; transform: translate(-280px, 10px) scale(.3) rotate(0deg); }
      24% { opacity: 1; }
      100% { opacity: 0; transform: translate(-338px, 92px) scale(1.1) rotate(110deg); }
    }

    @keyframes spark2 {
      0% { opacity: 0; transform: translate(252px, 0) scale(.25) rotate(0deg); }
      24% { opacity: 1; }
      100% { opacity: 0; transform: translate(326px, 104px) scale(1) rotate(-90deg); }
    }

    @keyframes spark3 {
      0% { opacity: 0; transform: translate(220px, 30px) scale(.2) rotate(0deg); }
      30% { opacity: .9; }
      100% { opacity: 0; transform: translate(286px, 128px) scale(.9) rotate(80deg); }
    }
  </style>
</head>
<body>
  <main id="stage" class="stage" aria-live="polite">
    <div class="spark s1">✦</div>
    <div class="spark s2">♥</div>
    <div class="spark s3">♠</div>

    <section id="alert" class="alert" aria-hidden="true">
      <div class="icon">♥</div>
      <div class="copy">
        <span class="kicker">NOVO FOLLOW NO TIKTOK</span>
        <strong id="nick" class="nick"></strong>
        <span class="sub">bem-vindo ao buraco · obrigado por seguir</span>
      </div>
      <div class="stamp">
        <span>TIKTOK</span>
        <b>FOLLOW</b>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var rawNick = String(params.get("nick") || "").trim();
      if (!rawNick) return;

      var duration = Number(params.get("duration") || 6000);
      if (!isFinite(duration) || duration < 1200) duration = 6000;

      var stage = document.getElementById("stage");
      var alert = document.getElementById("alert");
      var nick = document.getElementById("nick");

      nick.textContent = rawNick.charAt(0) === "@" ? rawNick : "@" + rawNick;
      alert.setAttribute("aria-hidden", "false");
      stage.classList.add("active");
      alert.classList.add("show");

      if (params.get("stay") === "1") return;

      window.setTimeout(function () {
        alert.classList.remove("show");
        alert.classList.add("hide");
      }, duration);

      window.setTimeout(function () {
        alert.setAttribute("aria-hidden", "true");
        stage.classList.remove("active");
      }, duration + 600);
    })();
  </script>
</body>
</html>
