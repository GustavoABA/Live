<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08060d">
  <title>NihilGuh — Iniciando · Fanarts</title>
  <link rel="stylesheet" href="../shared/scene.css?v=20261007-1">
  <link rel="stylesheet" href="fanarts.css?v=20261018-2">
  <link rel="stylesheet" href="../shared/ambient.css?v=20261031-1">
</head>
<body>
  <main class="scene" data-scene="0">
    <div class="backdrop"></div>
    <div class="stars"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="noise"></div>
    <div class="ornament-border"></div>

    <header class="brand fade-up">
      <strong>NihilGuh</strong>
      <span>Midnight cat club</span>
    </header>
    <div class="scene-index fade-up"><b>00 · iniciando</b><span>entre luas e caos</span></div>

    <div class="character fade-up d2" data-character aria-hidden="true">
      <img class="open" src="../assets/nihilguh-character-open.png" alt="">
      <img class="blink" src="../assets/nihilguh-character-blink-v2.png" alt="">
    </div>

    <section class="hero hero-right fade-up d3" aria-label="Início da transmissão">
      <span class="eyebrow">a noite está acordando</span>
      <h1 class="title">A live<br>vai começar</h1>
      <div class="rule">✦</div>
      <div class="subtitle">chega mais · fica à vontade</div>
      <div class="countdown" data-countdown="10">10:00</div>
    </section>

    <section class="fanarts" aria-label="Galeria de fanarts da comunidade">
      <header class="fanarts-heading"><h2>Artes feitas por vocês</h2></header>
      <div class="fanarts-window" data-fanart-viewport aria-label="Exibição automática das fanarts">
        <div class="fanarts-track" data-fanart-track>
          <figure class="fanart-card">
            <img src="../assets/fanarts/belle--nihilguh.webp" alt="Fanart da comunidade" decoding="async">
          </figure>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>eu juro que isso aqui é conteúdo</span>
      <span>nihilguh · ao vivo em breve</span>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script src="../shared/scene.js?v=20261007-3"></script>
  <script src="fanarts.js?v=20261018-2"></script>
  <script src="../shared/ambient.js?v=20261031-1"></script>
</body>
</html>
