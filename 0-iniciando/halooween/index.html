<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NihilGuh — Iniciando: Halloween</title>
  <link rel="stylesheet" href="halloween.css">
</head>
<body>
  <main class="scene" aria-label="Cena de início especial de Halloween">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="mist mist-one" aria-hidden="true"></div>
    <div class="mist mist-two" aria-hidden="true"></div>
    <div class="web web-left" aria-hidden="true"></div>
    <div class="web web-right" aria-hidden="true"></div>
    <div class="bats" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="embers" aria-hidden="true"></div>

    <header class="brand">
      <strong>NihilGuh</strong>
      <span>Midnight cat club · noite das bruxas</span>
    </header>
    <div class="scene-index"><b>00 · Halloween</b><span>portas abertas à meia-noite</span></div>

    <div class="character" aria-hidden="true">
      <img src="../../assets/nihilguh-character-open.png" alt="">
    </div>

    <section class="hero">
      <span class="eyebrow">algo está acordando na escuridão</span>
      <h1>A live<br>vai começar</h1>
      <div class="rule"><span>☾</span><i></i><span>✦</span><i></i><span>☾</span></div>
      <p>pegue sua coragem · a noite é nossa</p>
      <div class="countdown" data-countdown="10"><span>⌛</span><output>10:00</output></div>
    </section>

    <div class="pumpkins" aria-hidden="true"><i>⌁</i><i>⌁</i><i>⌁</i></div>
    <footer><span>cuidado com o que espreita no chat</span><span>nihilguh · ao vivo em breve</span></footer>
  </main>
  <script src="halloween.js"></script>
</body>
</html>
