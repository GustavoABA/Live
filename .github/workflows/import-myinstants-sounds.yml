          download 'cativeiro-43348.mp3' 'https://www.myinstants.com/media/sounds/cativeiro.mp3' 'https://www.myinstants.com/pt/instant/cativeiro-43348/'
          download 'bom-dia-pra-quem-quiser-61923.mp3' 'https://www.myinstants.com/media/sounds/bom-dia_BvImHGa.mp3' 'https://www.myinstants.com/pt/instant/bom-dia-pra-quem-quiser-61923/'

          echo "Baixados: $(find Sounds -type f -name '*.mp3' | wc -l)"

      - name: Commit downloaded sounds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sounds
          if git diff --cached --quiet; then
            echo "Nenhum áudio foi baixado."
            exit 0
          fi
          git commit -m "assets: adicionar sons para Casterlabs"
          git push
