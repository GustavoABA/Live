name: Import MyInstants Sounds

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-sounds:
    if: github.event.issue.title == 'IMPORT_MYINSTANTS_SOUNDS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sounds
        shell: bash
        run: |
          set +e
          mkdir -p Sounds

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'

          download() {
            local out="$1"
            local url="$2"
            local referer="$3"
            echo "[GET] $out <- $url"
            if curl -fL --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 60 \
              -A "$UA" \
              -H 'Accept: audio/mpeg,audio/*;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: pt-BR,pt;q=0.9,en;q=0.8' \
              -e "$referer" \
              "$url" -o "Sounds/$out"; then
              bytes=$(wc -c < "Sounds/$out")
              if [ "$bytes" -gt 100 ]; then
                echo "[OK] $out ($bytes bytes)"
              else
                echo "[FAIL] $out: arquivo pequeno demais"
                rm -f "Sounds/$out"
              fi
            else
              echo "[FAIL] $out"
              rm -f "Sounds/$out"
            fi
          }

          # O Fahhh já possui um espelho público funcional no GitHub.
