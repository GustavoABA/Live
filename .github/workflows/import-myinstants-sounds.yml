name: Import Missing MyInstants Sound

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-sound:
    if: github.event.issue.title == 'IMPORT_MYINSTANTS_SOUNDS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and download maldito-traidor-70615
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          PAGE='https://www.myinstants.com/pt/instant/maldito-traidor-70615/'
          mkdir -p Sounds

          for P in \
            'https://www.myinstants.com/pt/instant/maldito-traidor-70615/' \
            'https://www.myinstants.com/en/instant/maldito-traidor-70615/' \
            'https://www.myinstants.com/instant/maldito-traidor-70615/embed/'; do
            echo "[PAGE] $P"
            HTML=$(curl -fsSL -A "$UA" -H 'Accept-Language: pt-BR,pt;q=0.9,en;q=0.8' "$P")
            CANDIDATE=$(printf '%s' "$HTML" | grep -oE '(/media/sounds/[^"'"'"'<> ]+\.mp3)' | head -n1)
            echo "[CANDIDATE] $CANDIDATE"
            if [ -n "$CANDIDATE" ]; then
              URL="https://www.myinstants.com$CANDIDATE"
              if curl -fL -A "$UA" -H 'Accept: audio/mpeg,audio/*;q=0.9,*/*;q=0.8' -e "$PAGE" "$URL" -o Sounds/maldito-traidor-70615.mp3; then
                echo "[OK] $(wc -c < Sounds/maldito-traidor-70615.mp3) bytes"
                break
              fi
            fi
          done

          if [ ! -s Sounds/maldito-traidor-70615.mp3 ]; then
            rm -f Sounds/maldito-traidor-70615.mp3
            echo '[FAIL] Não foi possível resolver o MP3.'
          fi

      - name: Commit if downloaded
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sounds/maldito-traidor-70615.mp3 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Nada novo para commit.'
            exit 0
          fi
          git commit -m 'assets: adicionar maldito traidor 70615'
          git push
